# ================================================
# =================== General ====================
# ================================================

# Vi-mode
set -g mode-keys vi

# Enable true-color support
set -ga terminal-overrides ",*256col*:Tc"

# Set title from the shell
set -g set-titles on
set -g set-titles-string "#{window_name}"

# NeoVim wants this
set -g focus-events on

# Pi wants this, but in Kitty this doesn't work :(
set -g extended-keys always
set -g extended-keys-format csi-u

# ================================================
# ============== Custom Keybindings ==============
# ================================================

# Change tmux prefix to not conflict with Vim.
# This also prevents locking the terminal.
set -g prefix C-s

# Creating new panes or windows (aka tabs)
bind h split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'
bind t new-window

# Choosing panes (w/o prefix, for speed)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Vi-like keybinds in copy mode
unbind -T copy-mode-vi Space
bind -T copy-mode-vi v send-keys -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-on \; send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe
bind -T copy-mode-vi Y send-keys -X copy-pipe-line

# ================================================
# ================ Mouse Settings ================
# ================================================

# Enable mouse mode
set -g mouse on

# Scroll a single line at once
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Do not copy selection and cancel copy mode on drag-end.
# Instead, copy selection on mouse click after selecting text.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# ================================================
# ================= Themeing =====================
# ================================================

# NOTE: Colors are made w.r.t. the solarized-dark color scheme

# Make the status-bar invisible (ie. merge bg color with terminal bg)
set -g status-style 'bg=terminal'
set -g message-style 'fg=white,bg=terminal'

# OSC 9;4 progress-bar indicator before the window name, based on the
# active pane's #{pane_pb_state}:
#   normal: #{pane_pb_progress}%  indeterminate: ⏳  error: ⚠  paused: ⏸
# Lives in @window-status-name because #{E:...} re-expands it per window.
set -g @window-status-name ' #{?#{==:#{pane_pb_state},hidden},,#{?#{==:#{pane_pb_state},normal},#{pane_pb_progress}% ,#{?#{==:#{pane_pb_state},indeterminate},⏳ ,#{?#{==:#{pane_pb_state},error},⚠ ,⏸ }}}}#{window_name} '

# Window status formatting, powerline-style
set -g status-left '#[fg=black,bg=white] #{session_name} #[fg=white,bg=terminal]'
set -g window-status-format '#{E:@window-status-name}'
set -g window-status-current-format '#[fg=blue,bg=terminal]#[fg=black,bg=blue]#{E:@window-status-name}#[fg=blue,bg=terminal]'
set -g window-status-style 'fg=white,bg=terminal'

# Pane colors
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'

# Allow longer session names
set -g status-left-length 15

# ================================================
# ================= SSH-specific =================
# ================================================

# Source specific config files depending on whether local or remote
if-shell 'test -n "$SSH_CLIENT" || test -n "$SSH_TTY"' \
    'source-file $HOME/.config/tmux/tmux.remote.conf' \
    'source-file $HOME/.config/tmux/tmux.local.conf'
