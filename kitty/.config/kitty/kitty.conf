# Fixes for wierd behaviour with bash and vim over SSH
term xterm-256color

# Close terminal on exit
close_on_child_death yes

# Scroll a single line at once
wheel_scroll_multiplier 1.0

# Multiplexing mode
enabled_layouts splits

# Multiplexing styling
tab_bar_edge top
tab_bar_style powerline
tab_bar_margin_width 6.0
tab_bar_margin_height 6.0 6.0
tab_powerline_style slanted
draw_minimal_borders no
window_border_width 2.0

# Unset keybindings to use custom ones
clear_all_shortcuts yes

# Add back the clipboard keybinds
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrolling keyboard mode
map --new-mode sc ctrl+[
map --mode sc k scroll_line_up smooth
map --mode sc j scroll_line_down smooth
map --mode sc ctrl+u remote_control scroll-window 0.5p-
map --mode sc ctrl+d remote_control scroll-window 0.5p
map --mode sc ctrl+b scroll_page_up
map --mode sc ctrl+f scroll_page_down
map --mode sc page_up scroll_page_up
map --mode sc page_down scroll_page_down
map --mode sc g scroll_home
map --mode sc shift+g scroll_end
map --mode sc home scroll_home
map --mode sc end scroll_end
map --mode sc esc combine , scroll_end , pop_keyboard_mode

# Multiplexing keyboard mode
map --new-mode mp ctrl+s
map --mode mp t combine , new_tab , pop_keyboard_mode
map --mode mp n combine , next_tab , pop_keyboard_mode
map --mode mp p combine , previous_tab , pop_keyboard_mode
map --mode mp h combine , launch --location=vsplit --cwd=current , pop_keyboard_mode
map --mode mp v combine , launch --location=hsplit --cwd=current , pop_keyboard_mode
map --mode mp shift+h combine , launch --location=vsplit , pop_keyboard_mode
map --mode mp shift+v combine , launch --location=hsplit , pop_keyboard_mode
map --mode mp ctrl+o combine , layout_action rotate , pop_keyboard_mode
map --mode mp space combine , layout_action equalize , pop_keyboard_mode
map --mode mp esc pop_keyboard_mode

# Quick switching without the multiplexing mode
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right

# Quick moving without the multiplexing mode
map ctrl+shift+h move_window left
map ctrl+shift+j move_window bottom
map ctrl+shift+k move_window top
map ctrl+shift+l move_window right

# Font
font_family JetBrainsMono NF
font_size 14.0

# Color Scheme
cursor none
foreground #b9b9b9
background #181818
selection_background #3b3b3b
color0  #252525
color1  #ed4a46
color2  #70b433
color3  #dbb32d
color4  #368aeb
color5  #eb6eb7
color6  #3fc5b7
color7  #777777
color8  #3b3b3b
color9  #ff5e56
color10 #83c746
color11 #efc541
color12 #4f9cfe
color13 #ff81ca
color14 #56d8c9
color15 #dedede
active_border_color #368aeb
inactive_border_color #3b3b3b
bell_border_color #efc541
active_tab_foreground #181818
active_tab_background #368aeb
inactive_tab_foreground #b9b9b9
inactive_tab_background #181818

# Padding around terminal
window_padding_width 6.0
